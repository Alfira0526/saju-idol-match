name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/idol-saju-matching-app-752fy3"]
  workflow_dispatch:

# Allow the workflow to enable Pages and publish the site.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Programmatically enable Pages (build type = GitHub Actions)
          # so no manual repo-settings toggle is required.
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
