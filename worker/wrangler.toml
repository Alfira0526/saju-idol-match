name = "saju-suggest"
main = "suggest-worker.js"
compatibility_date = "2024-11-01"

# Cron: 큐를 GitHub에 배치 반영(제보 1건마다 커밋하지 않도록). 10분마다.
# 대시보드 배포 시엔 toml이 안 읽히므로 워커 Settings→Triggers→Cron Triggers에서 동일하게 추가.
[triggers]
crons = ["*/10 * * * *"]

# KV 네임스페이스 바인딩.
# 아래 id 값은 `wrangler kv namespace create SUGGEST_KV` 실행 후 출력되는 값으로 교체하세요.
[[kv_namespaces]]
binding = "SUGGEST_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# GitHub 미러링 대상(제보를 저장소 파일로 커밋 → 루틴이 egress 없이 로컬로 읽음).
[vars]
GH_REPO = "Alfira0526/saju-idol-match"
GH_BRANCH = "claude/idol-saju-matching-app-752fy3"

# 시크릿은 toml에 적지 말고 아래 명령으로 등록하세요.
#   wrangler secret put ADMIN_TOKEN   # 관리용 토큰
#   wrangler secret put IP_SALT       # IP 해시 솔트
#   wrangler secret put GH_TOKEN      # GitHub fine-grained PAT(contents:read&write) — 미러링용
